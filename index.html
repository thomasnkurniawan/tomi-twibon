<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Twibbonizer</title>
  </head>
  <body class="min-h-screen bg-gray-50 flex flex-col items-center justify-center p-4">
    <!-- Header -->
    <header class="text-center mb-8">
      <h1 class="text-4xl font-bold text-gray-800">Twibbonizer</h1>
      <p class="text-gray-500 mt-1">Frame your photos</p>
    </header>

    <!-- Upload Zone -->
    <div id="upload-zone" class="border-2 border-dashed border-gray-400 rounded-xl p-12 text-center cursor-pointer hover:border-blue-500 hover:bg-blue-50 transition-colors max-w-[480px] w-full mb-4" tabindex="0" role="button" aria-label="Upload your photo">
      <p class="text-lg font-medium text-gray-700">Click or drag your photo here</p>
      <p class="text-sm text-gray-400 mt-1">Supports JPG, PNG, WEBP</p>
      <input type="file" id="photo-input" accept="image/*" class="hidden">
    </div>

    <!-- Editor Section (hidden initially) -->
    <div id="editor-section" class="hidden w-full max-w-[480px]">
      <div id="editor-container" class="relative overflow-hidden w-full aspect-square mx-auto rounded-lg shadow-lg bg-gray-100" style="background-size:cover;background-position:center;background-repeat:no-repeat">
        <div id="twibbon-wrapper" style="position:absolute;top:0;left:0;width:100%;height:100%">
          <img id="twibbon-img" style="width:100%;height:100%;display:block;pointer-events:none" draggable="false" alt="Twibbon overlay">
          <!-- Resize Handles -->
          <div class="resize-handle" data-corner="nw" style="position:absolute;top:-5px;left:-5px;width:10px;height:10px;background:white;border:2px solid #3b82f6;border-radius:2px;z-index:10;cursor:nw-resize"></div>
          <div class="resize-handle" data-corner="ne" style="position:absolute;top:-5px;right:-5px;width:10px;height:10px;background:white;border:2px solid #3b82f6;border-radius:2px;z-index:10;cursor:ne-resize"></div>
          <div class="resize-handle" data-corner="sw" style="position:absolute;bottom:-5px;left:-5px;width:10px;height:10px;background:white;border:2px solid #3b82f6;border-radius:2px;z-index:10;cursor:sw-resize"></div>
          <div class="resize-handle" data-corner="se" style="position:absolute;bottom:-5px;right:-5px;width:10px;height:10px;background:white;border:2px solid #3b82f6;border-radius:2px;z-index:10;cursor:se-resize"></div>
        </div>
      </div>

      <!-- Controls Bar -->
      <div id="controls" class="flex items-center justify-between mt-4 max-w-[480px] mx-auto w-full px-2">
        <span id="twibbon-label" class="text-sm text-gray-600">Using default twibbon</span>
        <button id="change-twibbon-btn" class="text-sm text-blue-600 underline cursor-pointer">Change twibbon</button>
        <input type="file" id="twibbon-input" accept="image/png" class="hidden">
      </div>

      <!-- Download Button -->
      <button id="download-btn" disabled class="mt-4 w-full max-w-[480px] bg-blue-600 text-white py-3 rounded-xl font-semibold hover:bg-blue-700 disabled:opacity-40 disabled:cursor-not-allowed transition-colors mx-auto block" aria-label="Download your twibbonized photo">Download Image</button>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
